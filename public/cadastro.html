<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>

    <div class="main">
        <div class="logo">
            <img src="logo.png">
        </div>

        
    </div>

    

    <!-- CADASTRO -->
    <div class="login-container">
        <h2>Criar Conta</h2>

        <form id="cadastroForm">

            <div class="input-box">
                <input type="text" id="nome" placeholder="Nome" required>
            </div>

            <div class="input-box">
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <input type="password" id="senha" placeholder="Senha" required>
            </div>

            <button class="btn" type="submit">Cadastrar</button>
        </form>

       
    </div>

</header>

<script>

/* 🔥 ALTERADO: criado BASE_URL (igual aos outros ficheiros) */
const BASE_URL = "https://ged-mbs1.onrender.com";

document.getElementById("cadastroForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try { /* 🔥 ALTERADO: adicionado try/catch */
        
        /* 🔥 ALTERADO: removido localhost */
        const res = await fetch(BASE_URL + "/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ nome, email, senha })
        });

        const data = await res.json();

        if(res.ok){
            alert("Conta criada com sucesso!"); /* 🔥 ALTERADO: mensagem melhor */
            window.location.href = "index.html";
        } else {
            alert(data.message || "Erro ao cadastrar"); /* 🔥 ALTERADO */
        }

    } catch (err) {
        alert("Erro ao conectar com o servidor (Render pode estar a dormir)"); /* 🔥 ALTERADO */
        console.error(err);
    }
});
</script>

</body>
</html>
